# Reconstructed from the revised manuscript and yolov11-train.py.
# Use the official single-class dataset YAML via the data= CLI option.
epochs: 280
imgsz: 480
batch: 4
workers: 2
optimizer: SGD
pretrained: true
lr0: 0.008
lrf: 0.05
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: true
patience: 80
cache: false
amp: true
mosaic: 0.1
mixup: 0.0
fliplr: 0.5
translate: 0.05
scale: 0.15
degrees: 1.5
shear: 0.1
hsv_h: 0.012
hsv_s: 0.35
hsv_v: 0.35
box: 7.0
cls: 0.4
dfl: 1.0
# Ultralytics 8.3.204 discards label_smoothing during config validation.

